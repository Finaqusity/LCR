# OpenOCD 配置：DAPmini / DAPLink（CMSIS-DAP）下载器 + STM32F407VET6
# 用法：
#   openocd -f tools\openocd-cmsis-dap-f407.cfg -c "program build\lcr-fw.elf verify reset exit"
#   openocd -f tools\openocd-cmsis-dap-f407.cfg            （调试：留一个 GDB server，监听 3333）

adapter driver cmsis-dap
transport select swd
adapter speed 4000

# 如果你的电脑上插了多个 CMSIS-DAP 设备，取消下面一行的注释并填 DAPmini 的 VID/PID
# cmsis_dap_vid_pid 0x0d28 0x0204

# STM32F4 系列目标（F407VET6：1 MB Flash / 192 KB RAM）
source [find target/stm32f4x.cfg]
